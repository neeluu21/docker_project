services:
  frontend:
    build: ./frontend
    container_name: devopspulse-frontend
    ports:
      - "8000:80"
    depends_on:
      - backend
    networks:
      - devopspulse

  backend:
    build: ./backend
    container_name: devopspulse-backend
    ports:
      - "5000:5000"
    networks:
      - devopspulse

networks:
  devopspulse:
    driver: bridge
